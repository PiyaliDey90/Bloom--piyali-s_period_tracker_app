<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Bloom"/>
  <meta name="theme-color" content="#c97baa"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <title>Bloom — Health Tracker</title>
  <style>
    :root{
      --pink:#c97baa;--pink-light:#f0c4df;--pink-dark:#9e5080;
      --purple:#9b7ec8;--purple-light:#d8cff0;
      --bg:#fdf0f6;--surface:#fff;--surface-alt:#f9e8f3;--border:#e8c8de;
      --text:#3d2040;--muted:#8a607a;--white:#fff;
      --period-color:#e8648c;--period-bg:#fde8ef;
      --fertile-color:#b090e0;--fertile-bg:#ede8f8;
      --predicted:#f4aec8;--ovulation:#7a4fbf;
      --green:#4caf7d;--blue:#5b8fd6;--orange:#e07c3a;--red:#e84848;
      --shadow:0 2px 12px rgba(201,123,170,.12);
      --shadow-lg:0 8px 40px rgba(61,32,64,.2);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-top:env(safe-area-inset-top,0px);
      --nav-h:60px;
      --r-sm:6px;--r-md:12px;--r-lg:20px;--r-full:9999px;
      --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#1e0f1a;--surface:#2d1a28;--surface-alt:#3a2235;--border:#5a3050;--text:#f0d8ea;--muted:#c09ab0;}
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
    button{font-family:inherit;cursor:pointer;border:none;background:none}
    input,textarea,select{font-family:inherit;font-size:15px;color:var(--text)}

    #app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;overflow:hidden}
    #content{flex:1;overflow-y:auto;padding:16px;padding-top:calc(var(--safe-top)+16px);padding-bottom:calc(var(--nav-h)+var(--safe-bottom)+24px)}

    /* ── Nav ── */
    .nav{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:calc(var(--nav-h)+var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--surface);border-top:1px solid var(--border);z-index:100}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);padding-top:6px;cursor:pointer;transition:color .15s}
    .nav-item.active{color:var(--pink)}
    .nav-icon{font-size:18px;line-height:1}
    .nav-label{font-size:9px;font-weight:600}

    /* ── Shared ── */
    .page-title{font-size:22px;font-weight:700;margin-bottom:16px}
    .card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
    .btn{border-radius:var(--r-full);padding:12px 24px;font-size:15px;font-weight:600;width:100%;transition:opacity .15s}
    .btn:active{opacity:.8}
    .btn-primary{background:var(--pink);color:var(--white)}
    .btn-secondary{background:var(--surface-alt);color:var(--pink-dark)}
    .btn-danger{background:#fde8ef;color:#e8648c}
    .btn-green{background:#e6f7ef;color:#2e7d55}
    .btn-saved{background:var(--green)!important;color:white!important}
    .section-label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
    .form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--surface-alt);color:var(--text);font-size:15px}
    .form-input:focus{outline:none;border-color:var(--pink)}
    .form-error{color:#e8648c;font-size:13px;margin-bottom:10px}
    .chip-row{display:flex;gap:8px;flex-wrap:wrap}
    .chip{border:1.5px solid var(--border);border-radius:var(--r-full);padding:7px 13px;font-size:13px;color:var(--muted);background:transparent;transition:all .15s;white-space:nowrap;cursor:pointer}
    .chip.active{background:var(--pink);border-color:var(--pink);color:white}
    .icon-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;cursor:pointer}
    .icon-btn-edit{background:var(--purple-light);color:var(--ovulation)}
    .icon-btn-del{background:#fde8ef;color:#e8648c}
    .empty-state{text-align:center;padding:40px 16px;color:var(--muted)}
    .empty-state .ei{font-size:44px;margin-bottom:10px}
    .empty-state p{font-size:14px;line-height:1.6}

    /* ── Modal ── */
    .overlay{position:fixed;inset:0;background:rgba(61,32,64,.4);display:flex;align-items:flex-end;z-index:200;animation:fadeIn .2s}
    .sheet{width:100%;max-width:430px;margin:0 auto;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:14px 18px calc(20px + var(--safe-bottom));box-shadow:var(--shadow-lg);animation:slideUp .25s ease;max-height:92vh;overflow-y:auto}
    .sheet-handle{width:38px;height:4px;background:var(--border);border-radius:var(--r-full);margin:0 auto 16px}
    .sheet-title{font-size:17px;font-weight:700;text-align:center;margin-bottom:16px}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}
    .optional{font-weight:400}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

    /* ── Home ── */
    .status-card{border-radius:var(--r-lg);padding:22px;margin-bottom:14px;text-align:center;transition:transform .1s}
    .status-card.clickable{cursor:pointer}
    .status-card.clickable:active{transform:scale(.98)}
    .status-period{background:linear-gradient(135deg,#e8648c,#c97baa);color:white}
    .status-today{background:linear-gradient(135deg,#c97baa,#9b7ec8);color:white}
    .status-late{background:linear-gradient(135deg,#9b7ec8,#7a6eb0);color:white}
    .status-upcoming{background:linear-gradient(135deg,var(--surface-alt),var(--pink-light))}
    .status-neutral{background:var(--surface-alt)}
    .status-label{font-size:20px;font-weight:700;margin-bottom:6px}
    .status-sub{font-size:13px;opacity:.85}
    .stats-row{display:flex;gap:10px;margin-bottom:14px}
    .stat-pill{flex:1;background:var(--surface);border-radius:var(--r-md);padding:11px;text-align:center;box-shadow:var(--shadow)}
    .stat-value{display:block;font-size:20px;font-weight:700;color:var(--pink)}
    .stat-label{display:block;font-size:9px;color:var(--muted);margin-top:2px}
    .install-banner{background:linear-gradient(135deg,var(--pink-light),var(--purple-light));border-radius:var(--r-md);padding:14px;margin-bottom:14px;font-size:13px;line-height:1.5}

    /* ── Phase ── */
    .phase-card{border-radius:var(--r-lg);padding:16px 18px;margin-bottom:14px;cursor:pointer;transition:transform .1s}
    .phase-card:active{transform:scale(.98)}
    .rec-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
    .rec-item:last-child{border-bottom:none}
    .rec-emoji{font-size:20px;flex-shrink:0;width:28px;text-align:center}
    .rec-label{font-size:13px;font-weight:600;margin-bottom:2px}
    .rec-reason{font-size:11px;color:var(--muted);line-height:1.4}
    .avoid-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--border)}
    .avoid-item:last-child{border-bottom:none}
    .avoid-x{color:#e8648c;font-weight:700;font-size:15px;width:18px;flex-shrink:0}
    .tip-box{background:var(--surface-alt);border-radius:var(--r-md);padding:12px;font-size:13px;line-height:1.6}

    /* ── Calendar ── */
    .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .cal-title{font-size:17px;font-weight:700}
    .cal-nav{font-size:26px;color:var(--pink);padding:4px 10px}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:14px}
    .cal-dayname{text-align:center;font-size:10px;font-weight:600;color:var(--muted);padding:3px 0 7px}
    .cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;position:relative;font-size:12px;font-weight:500;transition:transform .1s}
    .cal-day:active{transform:scale(.9)}
    .cal-period{background:var(--period-bg);color:var(--period-color);font-weight:700}
    .cal-predicted{border:2px dashed var(--predicted)}
    .cal-fertile{background:var(--fertile-bg);color:var(--fertile-color)}
    .cal-ovulation{background:var(--purple-light);color:var(--ovulation);font-weight:700}
    .cal-today-ring{outline:2px solid var(--pink);outline-offset:1px}
    .cal-selected{outline:2.5px solid var(--pink-dark);outline-offset:1px}
    .cal-symdot{position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--pink-dark)}
    .cal-legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;justify-content:center}
    .legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
    .legend-dot{width:9px;height:9px;border-radius:3px}
    .sbadge{font-size:11px;font-weight:600;border-radius:var(--r-full);padding:2px 10px}
    .sbadge-period{background:var(--period-bg);color:var(--period-color)}
    .sbadge-predicted{background:var(--pink-light);color:var(--pink-dark)}
    .sbadge-fertile{background:var(--fertile-bg);color:var(--fertile-color)}
    .sbadge-ovulation{background:var(--purple-light);color:var(--ovulation)}

    /* ── History ── */
    .history-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .hstat{background:var(--surface);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow);text-align:center}
    .hstat-val{font-size:24px;font-weight:700;color:var(--pink)}
    .hstat-label{font-size:10px;color:var(--muted);margin-top:2px}
    .cycle-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
    .cycle-item:last-child{border-bottom:none}
    .cycle-dot{width:10px;height:10px;border-radius:50%;background:var(--period-color);flex-shrink:0}
    .cycle-dates{font-size:13px;font-weight:600}
    .cycle-meta{font-size:11px;color:var(--muted);margin-top:2px}

    /* ── Log ── */
    .water-row{display:flex;align-items:center;gap:14px}
    .water-count{font-size:26px;font-weight:700;color:var(--blue);min-width:28px;text-align:center}
    .water-btn{width:34px;height:34px;border-radius:50%;background:var(--purple-light);color:var(--purple);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center}
    .water-btn:active{background:var(--purple);color:white}

    /* ── Health (Blood Work) ── */
    .bw-marker-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
    .bw-marker-row:last-child{border-bottom:none}
    .bw-marker-name{flex:1;font-size:13px;font-weight:600}
    .bw-marker-val{font-size:13px;font-weight:700}
    .bw-marker-range{font-size:10px;color:var(--muted);margin-top:1px}
    .flag{font-size:11px;font-weight:700;border-radius:var(--r-full);padding:2px 8px}
    .flag-low{background:#fde8ef;color:#c0264a}
    .flag-high{background:#fef3e2;color:#8a5500}
    .flag-ok{background:#e6f7ef;color:#2e7d55}
    .trend-bar{height:6px;border-radius:3px;background:var(--border);margin-top:6px;overflow:hidden}
    .trend-fill{height:100%;border-radius:3px;transition:width .4s}
    .insight-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
    .insight-row:last-child{border-bottom:none}
    .insight-emoji{font-size:20px;flex-shrink:0}
    .insight-text{font-size:13px;line-height:1.5}
    .insight-text b{color:var(--text)}
    .photo-thumb{width:60px;height:60px;border-radius:var(--r-md);object-fit:cover;flex-shrink:0;cursor:pointer;border:2px solid var(--border)}
    .test-card{border-left:3px solid var(--pink)}

    /* ── Meds ── */
    .med-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
    .med-item:last-child{border-bottom:none}
    .med-check{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:14px;transition:all .2s}
    .med-check.done{background:var(--green);border-color:var(--green);color:white}
    .med-check.missed{background:#fde8ef;border-color:#e8648c;color:#e8648c}
    .med-name{font-size:14px;font-weight:600;flex:1}
    .med-dose{font-size:12px;color:var(--muted);margin-top:1px}
    .med-time{font-size:11px;background:var(--surface-alt);color:var(--pink-dark);border-radius:var(--r-full);padding:2px 8px;font-weight:600;white-space:nowrap}
    .refill-warn{background:#fef3e2;border-radius:var(--r-md);padding:10px 14px;font-size:12px;color:#8a5500;display:flex;align-items:center;gap:8px;margin-bottom:14px}

    /* ── Settings ── */
    .settings-section{font-size:14px;font-weight:700;color:var(--pink-dark);margin-bottom:14px}
    .stepper-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
    .stepper-row:last-child{border-bottom:none}
    .stepper-label{font-size:13px}
    .stepper-controls{display:flex;align-items:center;gap:10px}
    .stepper-btn{width:30px;height:30px;border-radius:50%;background:var(--pink-light);color:var(--pink-dark);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
    .stepper-btn:active{background:var(--pink);color:white}
    .stepper-val{font-size:17px;font-weight:700;min-width:26px;text-align:center;color:var(--pink)}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .toggle-label{font-size:13px;font-weight:600}
    .toggle-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .toggle-btn{background:var(--border);color:var(--muted);border-radius:var(--r-full);padding:7px 14px;font-size:13px;font-weight:700}
    .toggle-btn.on{background:var(--pink);color:white}
    .add-sym-row{display:flex;gap:8px}
    .add-sym-input{flex:1;padding:9px 13px;border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--surface-alt);color:var(--text);font-size:14px}
    .add-sym-input:focus{outline:none;border-color:var(--pink)}
    .add-sym-btn{background:var(--pink);color:white;border-radius:var(--r-md);padding:9px 14px;font-size:14px;font-weight:600}
    .about-block{text-align:center;padding:20px 16px;color:var(--muted);font-size:12px;line-height:2}
  </style>
</head>
<body>
<div id="app">
  <div id="content"></div>
  <nav class="nav">
    <div class="nav-item active" data-page="home"><span class="nav-icon">🌸</span><span class="nav-label">Home</span></div>
    <div class="nav-item" data-page="calendar"><span class="nav-icon">📅</span><span class="nav-label">Calendar</span></div>
    <div class="nav-item" data-page="meds"><span class="nav-icon">💊</span><span class="nav-label">Meds</span></div>
    <div class="nav-item" data-page="health"><span class="nav-icon">🩺</span><span class="nav-label">Health</span></div>
    <div class="nav-item" data-page="settings"><span class="nav-icon">⚙️</span><span class="nav-label">Settings</span></div>
  </nav>
</div>
<script>
// ── Data Layer ────────────────────────────────────────────────────────────────
const DB={
  get cycles(){try{return JSON.parse(localStorage.getItem('pt_cycles')||'[]')}catch{return[]}},
  get symptoms(){try{return JSON.parse(localStorage.getItem('pt_symptoms')||'[]')}catch{return[]}},
  get meds(){try{return JSON.parse(localStorage.getItem('pt_meds')||'[]')}catch{return[]}},
  get medLogs(){try{return JSON.parse(localStorage.getItem('pt_medlogs')||'{}')}catch{return{}}},
  get bloodTests(){try{return JSON.parse(localStorage.getItem('pt_blood')||'[]')}catch{return[]}},
  get settings(){
    try{return{averageCycleLength:28,averagePeriodLength:5,notificationsEnabled:false,reminderDaysBefore:2,weightUnit:'kg',customSymptoms:[],userSupplements:[],...JSON.parse(localStorage.getItem('pt_settings')||'{}')}}
    catch{return{averageCycleLength:28,averagePeriodLength:5,notificationsEnabled:false,reminderDaysBefore:2,weightUnit:'kg',customSymptoms:[],userSupplements:[]}}
  },
  saveCycles(v){localStorage.setItem('pt_cycles',JSON.stringify(v))},
  saveSymptoms(v){localStorage.setItem('pt_symptoms',JSON.stringify(v))},
  saveMeds(v){localStorage.setItem('pt_meds',JSON.stringify(v))},
  saveMedLogs(v){localStorage.setItem('pt_medlogs',JSON.stringify(v))},
  saveBloodTests(v){localStorage.setItem('pt_blood',JSON.stringify(v))},
  saveSettings(v){localStorage.setItem('pt_settings',JSON.stringify(v))},
  updateSetting(k,v){const s=this.settings;s[k]=v;this.saveSettings(s)}
}

// ── Date Utils ────────────────────────────────────────────────────────────────
const todayISO=()=>toISO(new Date())
const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`
const pad=n=>String(n).padStart(2,'0')
const parseISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r}
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/86400000)
const daysUntil=iso=>daysBetween(todayISO(),iso)
const isInRange=(d,s,e)=>d>=s&&d<=e
const fmtShort=iso=>parseISO(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'})
const fmtMonthYear=(y,m)=>new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})
function getDaysInMonth(y,m){const days=[],d=new Date(y,m,1);while(d.getMonth()===m){days.push(toISO(d));d.setDate(d.getDate()+1)}return days}
const firstDayOfMonth=(y,m)=>new Date(y,m,1).getDay()

// ── Cycle Algorithms ──────────────────────────────────────────────────────────
function avgCycleLength(cycles,fallback=28){
  const sorted=[...cycles].filter(c=>c.startDate).sort((a,b)=>a.startDate.localeCompare(b.startDate))
  if(sorted.length<2)return fallback
  const recent=sorted.slice(-7),lens=[]
  for(let i=1;i<recent.length;i++){const d=daysBetween(recent[i-1].startDate,recent[i].startDate);if(d>=15&&d<=60)lens.push(d)}
  return lens.length?Math.round(lens.reduce((a,b)=>a+b,0)/lens.length):fallback
}
function predictNext(cycles,settings){
  const sorted=[...cycles].filter(c=>c.startDate).sort((a,b)=>a.startDate.localeCompare(b.startDate))
  const last=sorted[sorted.length-1];if(!last)return null
  const avg=avgCycleLength(cycles,settings.averageCycleLength)
  const start=addDays(parseISO(last.startDate),avg)
  return{predictedStart:toISO(start),predictedEnd:toISO(addDays(new Date(start),settings.averagePeriodLength-1)),confidence:sorted.length>=3?'high':'low'}
}
function fertileWindow(cycles,settings){
  const sorted=[...cycles].filter(c=>c.startDate).sort((a,b)=>a.startDate.localeCompare(b.startDate))
  const last=sorted[sorted.length-1];if(!last)return null
  const avg=avgCycleLength(cycles,settings.averageCycleLength)
  const ov=addDays(parseISO(last.startDate),avg-14)
  return{fertileStart:toISO(addDays(ov,-5)),fertileEnd:toISO(addDays(ov,1)),ovulationDate:toISO(ov)}
}
function getDayStatus(iso,cycles,pred,fert){
  const s=[]
  for(const c of cycles){if(isInRange(iso,c.startDate,c.endDate||c.startDate)){s.push('period');break}}
  if(!s.includes('period')&&pred&&isInRange(iso,pred.predictedStart,pred.predictedEnd))s.push('predicted')
  if(fert){if(iso===fert.ovulationDate)s.push('ovulation');else if(isInRange(iso,fert.fertileStart,fert.fertileEnd))s.push('fertile')}
  return s
}
function cycleStats(cycles){
  const sorted=[...cycles].filter(c=>c.startDate).sort((a,b)=>a.startDate.localeCompare(b.startDate))
  const lengths=[],plen=[]
  for(let i=1;i<sorted.length;i++){const d=daysBetween(sorted[i-1].startDate,sorted[i].startDate);if(d>=15&&d<=60)lengths.push(d)}
  for(const c of sorted){if(c.endDate)plen.push(daysBetween(c.startDate,c.endDate)+1)}
  return{total:sorted.length,avg:lengths.length?Math.round(lengths.reduce((a,b)=>a+b,0)/lengths.length):null,shortest:lengths.length?Math.min(...lengths):null,longest:lengths.length?Math.max(...lengths):null,avgPeriod:plen.length?Math.round(plen.reduce((a,b)=>a+b,0)/plen.length*10)/10:null}
}

// ── Phases ────────────────────────────────────────────────────────────────────
const PHASES={

function getCurrentPhase(cycles,settings){
  const sorted=[...cycles].filter(c=>c.startDate).sort((a,b)=>b.startDate.localeCompare(a.startDate))
  const last=sorted[0];if(!last)return null
  const today=todayISO();if(today<last.startDate)return null
  const cycleDay=daysBetween(last.startDate,today)+1
  const avg=avgCycleLength(cycles,settings.averageCycleLength)
  const ovDay=avg-14
  let key
  if(cycleDay<=settings.averagePeriodLength)key='menstrual'
  else if(cycleDay<=ovDay-2)key='follicular'
  else if(cycleDay<=ovDay+2)key='ovulatory'
  else key='luteal'
  return{...PHASES[key],key,cycleDay,cycleLength:avg}
}

function flagValue(marker,val){
  const v=parseFloat(val)
  if(isNaN(v))return null
  if(v<marker.low)return'low'
  if(v>marker.high)return'high'
  return'ok'
}

// ── Insights engine ───────────────────────────────────────────────────────────
function getInsights(phase,bloodTests,meds){
  const insights=[]
  const latest={}
  for(const test of bloodTests){
    for(const r of(test.results||[])){
      if(!latest[r.markerId]||test.date>latest[r.markerId].date)latest[r.markerId]={...r,date:test.date}
    }
  }
  const get=id=>latest[id]
  const vitd=get('vitd'),iron=get('iron'),ferritin=get('ferritin'),zinc=get('zinc'),b12=get('b12'),cortisol=get('cortisol'),tsh=get('tsh'),insulin=get('insulin')
  if(vitd&&parseFloat(vitd.value)<30&&phase?.key==='luteal')insights.push({emoji:'☀️',text:'<b>Low Vitamin D + Luteal phase</b> — Vitamin D deficiency worsens hormonal acne and PMS. Consider 2000–4000 IU/day.'})
  if(zinc&&parseFloat(zinc.value)<70&&phase?.key==='luteal')insights.push({emoji:'⚪',text:'<b>Low Zinc + Luteal phase</b> — Zinc deficiency directly worsens hormonal acne. Supplement 30–45mg during luteal phase.'})
  if((iron&&parseFloat(iron.value)<60)||(ferritin&&parseFloat(ferritin.value)<15))insights.push({emoji:'🩸',text:'<b>Low Iron/Ferritin</b> — Explains fatigue, especially during your period. Supplement iron with Vitamin C for better absorption.'})
  if(cortisol&&parseFloat(cortisol.value)>20&&phase?.key==='luteal')insights.push({emoji:'😰',text:'<b>High Cortisol + Luteal phase</b> — Elevated cortisol spikes androgens, worsening acne and PMS. Stress management is critical now.'})
  if(tsh&&parseFloat(tsh.value)>3.0)insights.push({emoji:'🦋',text:'<b>TSH trending high</b> — Suboptimal thyroid function can cause irregular cycles, fatigue, and weight gain. Optimal TSH is 1–2.5.'})
  if(insulin&&parseFloat(insulin.value)>10&&phase?.key==='luteal')insights.push({emoji:'🍬',text:'<b>High Insulin + Luteal phase</b> — Insulin resistance worsens hormonal acne by triggering androgen production. Reduce refined carbs and sugar now.'})
  if(b12&&parseFloat(b12.value)<300)insights.push({emoji:'🟡',text:'<b>Low B12</b> — Can cause fatigue and mood issues. Supplement methylcobalamin B12 1000mcg/day.'})
  if(vitd&&parseFloat(vitd.value)<30)insights.push({emoji:'🌟',text:'<b>Low Vitamin D</b> — Affects mood, immunity, and hormone balance. Target 40–80 ng/mL.'})
  return insights
}

// ── Calendar ──────────────────────────────────────────────────────────────────
let calYear,calMonth,calSelected=null
function renderCalendar(){
  const now=new Date()
  if(!calYear)calYear=now.getFullYear()
  if(calMonth==null)calMonth=now.getMonth()
  const cycles=DB.cycles,settings=DB.settings
  const pred=predictNext(cycles,settings),fert=fertileWindow(cycles,settings)
  const days=getDaysInMonth(calYear,calMonth),firstDay=firstDayOfMonth(calYear,calMonth)
  const today=todayISO(),symDates=new Set(DB.symptoms.map(s=>s.date))
  const dayNames=['Su','Mo','Tu','We','Th','Fr','Sa']
  let grid=dayNames.map(d=>`<div class="cal-dayname">${d}</div>`).join('')
  for(let i=0;i<firstDay;i++)grid+='<div></div>'
  days.forEach(iso=>{
    const st=getDayStatus(iso,cycles,pred,fert)
    let cls='cal-day'
    if(st.includes('period'))cls+=' cal-period'
    if(st.includes('predicted'))cls+=' cal-predicted'
    if(st.includes('fertile'))cls+=' cal-fertile'
    if(st.includes('ovulation'))cls+=' cal-ovulation'
    if(iso===today)cls+=' cal-today-ring'
    if(iso===calSelected)cls+=' cal-selected'
    const dot=symDates.has(iso)?'<span class="cal-symdot"></span>':''
    grid+=`<div class="${cls}" data-iso="${iso}">${parseInt(iso.slice(8))}${dot}</div>`
  })
  const selSym=calSelected?DB.symptoms.find(s=>s.date===calSelected):null
  const selSt=calSelected?getDayStatus(calSelected,cycles,pred,fert):[]
  const bMap={period:'Period',predicted:'Predicted',fertile:'Fertile',ovulation:'Ovulation'}
  const bCls={period:'sbadge-period',predicted:'sbadge-predicted',fertile:'sbadge-fertile',ovulation:'sbadge-ovulation'}
  content.innerHTML=`
    <div class="cal-header"><button class="cal-nav" id="prev-month">‹</button><span class="cal-title">${fmtMonthYear(calYear,calMonth)}</span><button class="cal-nav" id="next-month">›</button></div>
    <div class="cal-grid">${grid}</div>
    <div class="cal-legend">
      <span class="legend-item"><span class="legend-dot" style="background:var(--period-bg);border:1px solid var(--period-color)"></span>Period</span>
      <span class="legend-item"><span class="legend-dot" style="border:2px dashed var(--predicted);background:transparent"></span>Predicted</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--fertile-bg)"></span>Fertile</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--purple-light)"></span>Ovulation</span>
    </div>
    ${calSelected?`<div class="card">
      <div style="font-weight:700;margin-bottom:10px;color:var(--pink-dark)">${calSelected}</div>
      ${selSt.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${selSt.map(s=>`<span class="sbadge ${bCls[s]}">${bMap[s]}</span>`).join('')}</div>`:''}
      ${selSym?`
        ${selSym.flow?`<div style="font-size:13px;color:var(--muted);margin-bottom:3px"><b style="color:var(--text)">Flow:</b> ${selSym.flow}</div>`:''}
        ${selSym.mood?`<div style="font-size:13px;color:var(--muted);margin-bottom:3px"><b style="color:var(--text)">Mood:</b> ${selSym.mood}</div>`:''}
        ${selSym.symptoms?.length?`<div style="font-size:13px;color:var(--muted);margin-bottom:3px"><b style="color:var(--text)">Symptoms:</b> ${selSym.symptoms.join(', ')}</div>`:''}
        ${selSym.weight?`<div style="font-size:13px;color:var(--muted);margin-bottom:3px"><b style="color:var(--text)">Weight:</b> ${selSym.weight} ${DB.settings.weightUnit}</div>`:''}
        ${selSym.water?`<div style="font-size:13px;color:var(--muted);margin-bottom:3px"><b style="color:var(--text)">Water:</b> ${selSym.water} glasses</div>`:''}
        ${selSym.notes?`<div style="font-size:13px;color:var(--muted)"><b style="color:var(--text)">Notes:</b> ${selSym.notes}</div>`:''}
      `:'<p style="font-size:13px;color:var(--muted)">No data logged for this day.</p>'}
    </div>`:''}
  `
  document.getElementById('prev-month').addEventListener('click',()=>{if(calMonth===0){calMonth=11;calYear--}else calMonth--;renderCalendar()})
  document.getElementById('next-month').addEventListener('click',()=>{if(calMonth===11){calMonth=0;calYear++}else calMonth++;renderCalendar()})
  document.querySelectorAll('.cal-day[data-iso]').forEach(el=>el.addEventListener('click',()=>{calSelected=el.dataset.iso===calSelected?null:el.dataset.iso;renderCalendar()}))
}

// ── Log ───────────────────────────────────────────────────────────────────────
const SYMPTOMS=[{id:'cramps',label:'Cramps',emoji:'😣'},{id:'bloating',label:'Bloating',emoji:'🫧'},{id:'headache',label:'Headache',emoji:'🤕'},{id:'backache',label:'Backache',emoji:'🔩'},{id:'nausea',label:'Nausea',emoji:'🤢'},{id:'fatigue',label:'Fatigue',emoji:'😴'},{id:'acne',label:'Acne',emoji:'🧴'},{id:'tender',label:'Breast pain',emoji:'💗'},{id:'cravings',label:'Cravings',emoji:'🍫'},{id:'spotting',label:'Spotting',emoji:'🩸'}]
const MOODS=[{id:'happy',label:'Happy',emoji:'😊'},{id:'calm',label:'Calm',emoji:'😌'},{id:'sensitive',label:'Sensitive',emoji:'🥺'},{id:'irritable',label:'Irritable',emoji:'😤'},{id:'anxious',label:'Anxious',emoji:'😰'},{id:'sad',label:'Sad',emoji:'😢'},{id:'energetic',label:'Energetic',emoji:'⚡'},{id:'tired',label:'Tired',emoji:'😩'}]
const FLOWS=[{id:'spotting',label:'Spotting'},{id:'light',label:'Light'},{id:'medium',label:'Medium'},{id:'heavy',label:'Heavy'},{id:'none',label:'None'}]
let logState={date:'',flow:'',mood:'',symptoms:[],notes:'',weight:'',water:0}
function renderLog(){
  if(!logState.date)logState.date=todayISO()
  const existing=DB.symptoms.find(s=>s.date===logState.date)
  if(existing)logState={date:logState.date,flow:existing.flow||'',mood:existing.mood||'',symptoms:existing.symptoms||[],notes:existing.notes||'',weight:existing.weight||'',water:existing.water||0}
  const settings=DB.settings
  const allSym=[...SYMPTOMS,...(settings.customSymptoms||[]).map(s=>({id:`custom_${s}`,label:s,emoji:'🏷️'}))]
  content.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <button id="log-back" style="background:none;border:none;font-size:22px;color:var(--pink);cursor:pointer;padding:0;line-height:1">‹</button>
      <h1 class="page-title" style="margin:0">Log Symptoms</h1>
    </div>
    <div class="card"><span class="section-label">Date</span><input type="date" id="log-date" class="form-input" value="${logState.date}" max="${todayISO()}"></div>
    <div class="card"><span class="section-label">Flow</span><div class="chip-row">${FLOWS.map(f=>`<button class="chip${logState.flow===f.id?' active':''}" data-flow="${f.id}">${f.label}</button>`).join('')}</div></div>
    <div class="card"><span class="section-label">Mood</span><div class="chip-row">${MOODS.map(m=>`<button class="chip${logState.mood===m.id?' active':''}" data-mood="${m.id}">${m.emoji} ${m.label}</button>`).join('')}</div></div>
    <div class="card"><span class="section-label">Symptoms</span><div class="chip-row">${allSym.map(s=>`<button class="chip${logState.symptoms.includes(s.id)?' active':''}" data-sym="${s.id}">${s.emoji} ${s.label}</button>`).join('')}</div></div>
    <div class="card"><span class="section-label">💧 Water (glasses)</span>
      <div class="water-row">
        <button class="water-btn" id="water-dec">−</button>
        <span class="water-count" id="water-val">${logState.water}</span>
        <button class="water-btn" id="water-inc">+</button>
        <span style="font-size:12px;color:var(--muted);margin-left:4px">glasses today</span>
      </div>
    </div>
    <div class="card"><span class="section-label">⚖️ Weight (${settings.weightUnit})</span>
      <div style="display:flex;align-items:center;gap:10px">
        <input type="number" id="log-weight" class="form-input" style="flex:1" value="${logState.weight}" placeholder="e.g. 58.5" step="0.1" min="20" max="300">
        <span style="font-size:13px;color:var(--muted);font-weight:600">${settings.weightUnit}</span>
      </div>
    </div>
    <div class="card"><span class="section-label">Notes</span><textarea id="log-notes" class="form-input" rows="3" placeholder="How are you feeling today?" style="resize:none">${logState.notes}</textarea></div>
    <button class="btn btn-primary" id="save-log" style="margin-bottom:14px">Save</button>
  `
  document.getElementById('log-back').addEventListener('click',()=>navigate('home'))
  document.getElementById('log-date').addEventListener('change',e=>{logState.date=e.target.value;renderLog()})
  document.querySelectorAll('[data-flow]').forEach(el=>el.addEventListener('click',()=>{logState.flow=logState.flow===el.dataset.flow?'':el.dataset.flow;renderLog()}))
  document.querySelectorAll('[data-mood]').forEach(el=>el.addEventListener('click',()=>{logState.mood=logState.mood===el.dataset.mood?'':el.dataset.mood;renderLog()}))
  document.querySelectorAll('[data-sym]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.sym;logState.symptoms=logState.symptoms.includes(id)?logState.symptoms.filter(s=>s!==id):[...logState.symptoms,id];renderLog()}))
  document.getElementById('water-dec').addEventListener('click',()=>{logState.water=Math.max(0,logState.water-1);document.getElementById('water-val').textContent=logState.water})
  document.getElementById('water-inc').addEventListener('click',()=>{logState.water=Math.min(20,logState.water+1);document.getElementById('water-val').textContent=logState.water})
  document.getElementById('log-weight').addEventListener('input',e=>{logState.weight=e.target.value})
  document.getElementById('log-notes').addEventListener('input',e=>{logState.notes=e.target.value})
  document.getElementById('save-log').addEventListener('click',()=>{
    const syms=DB.symptoms,i=syms.findIndex(s=>s.date===logState.date)
    const entry={id:i>=0?syms[i].id:crypto.randomUUID(),...logState}
    if(i>=0)syms[i]={...syms[i],...entry};else syms.unshift(entry)
    DB.saveSymptoms(syms)
    const btn=document.getElementById('save-log')
    btn.textContent='✓ Saved!';btn.classList.add('btn-saved')
    setTimeout(()=>{btn.textContent='Save';btn.classList.remove('btn-saved')},2000)
  })
}

// ── History ───────────────────────────────────────────────────────────────────
function renderHistory(){
  const cycles=DB.cycles

  const stats=cycleStats(cycles)
  content.innerHTML=`
    <h1 class="page-title">History 📊</h1>
    <div class="history-stats">
      ${[{val:stats.total||0,label:'Total cycles'},{val:stats.avg?`${stats.avg}d`:'—',label:'Avg cycle'},{val:stats.shortest?`${stats.shortest}d`:'—',label:'Shortest'},{val:stats.longest?`${stats.longest}d`:'—',label:'Longest'}].map(s=>`<div class="hstat"><div class="hstat-val">${s.val}</div><div class="hstat-label">${s.label}</div></div>`).join('')}

        const next=sorted[idx-1],cycleLen=next?daysBetween(c.startDate,next.startDate):null

        return`<div class="cycle-item">

          <div style="flex:1">
            <div class="cycle-dates">${fmtShort(c.startDate)}${c.endDate?' – '+fmtShort(c.endDate):' (ongoing)'}</div>

            <button class="icon-btn icon-btn-edit" data-edit="${c.id}">✏️</button>
            <button class="icon-btn icon-btn-del" data-del="${c.id}">🗑️</button>
          </div>
        </div>`}).join('')}
    </div>
  `
  document.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click',()=>{if(!confirm('Delete this cycle?'))return;DB.saveCycles(DB.cycles.filter(c=>c.id!==btn.dataset.del));renderHistory()}))
  document.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click',()=>{
    const c=DB.cycles.find(x=>x.id===btn.dataset.edit);if(!c)return
    const today=todayISO(),ov=document.createElement('div');ov.className='overlay'
    ov.innerHTML=`<div class="sheet">
      <div class="sheet-handle"></div><div class="sheet-title">Edit Cycle</div>
      <div class="form-group"><label>Start date</label><input type="date" id="edit-start" class="form-input" value="${c.startDate}" max="${today}"></div>
      <div class="form-group"><label>End date <span class="optional">(optional)</span></label><input type="date" id="edit-end" class="form-input" value="${c.endDate||''}" max="${today}"></div>
      <div id="edit-error" class="form-error" style="display:none"></div>
      <button class="btn btn-primary" id="edit-save" style="margin-bottom:8px">Save</button>
      <button class="btn btn-secondary" id="edit-cancel">Cancel</button>
    </div>`
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()})
    document.body.appendChild(ov)
    document.getElementById('edit-cancel').addEventListener('click',()=>ov.remove())
    document.getElementById('edit-save').addEventListener('click',()=>{
      const start=document.getElementById('edit-start').value,end=document.getElementById('edit-end').value,err=document.getElementById('edit-error')
      if(!start){err.style.display='block';err.textContent='Start date required';return}
      if(end&&end<start){err.style.display='block';err.textContent='End must be after start';return}
      DB.saveCycles(DB.cycles.map(x=>x.id===c.id?{...x,startDate:start,endDate:end||null}:x))
      ov.remove();renderHistory()
    })
  }))
}

// ── Meds ──────────────────────────────────────────────────────────────────────
function renderMeds(){
  const meds=DB.meds,today=todayISO(),logs=DB.medLogs,todayLog=logs[today]||{}
  const active=meds.filter(m=>m.active!==false),archived=meds.filter(m=>m.active===false)
  const refillWarnings=active.filter(m=>m.pillsLeft!=null&&m.pillsLeft<=7)
  content.innerHTML=`
    <h1 class="page-title">💊 Medications</h1>
    ${refillWarnings.length?`<div class="refill-warn">⚠️ Refill soon: ${refillWarnings.map(m=>`<b>${m.name}</b> (${m.pillsLeft} left)`).join(', ')}</div>`:''}
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div style="font-size:14px;font-weight:700">Today — ${today}</div>
        <button class="btn btn-primary" id="add-med-btn" style="width:auto;padding:7px 14px;font-size:13px">+ Add</button>
      </div>
      ${active.length===0?`<div class="empty-state"><div class="ei">💊</div><p>No medications added yet.<br>Tap + Add to get started.</p></div>`
      :active.map(m=>{
        const done=todayLog[m.id]==='done'
        const refillSoon=m.pillsLeft!=null&&m.pillsLeft<=7
        return`<div class="med-item">
          <div class="med-check${done?' done':''}" data-mc="${m.id}">${done?'✓':''}</div>
          <div style="flex:1">
            <div class="med-name">${m.name}${refillSoon?` <span style="font-size:10px;background:#fef3e2;color:#8a5500;border-radius:var(--r-full);padding:1px 6px;font-weight:600">⚠️ Refill</span>`:''}</div>
            <div class="med-dose">${[m.dose,m.frequency,m.time].filter(Boolean).join(' · ')}${m.pillsLeft!=null?` · ${m.pillsLeft} pills left`:''}</div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="icon-btn icon-btn-edit" data-med-edit="${m.id}">✏️</button>
            <button class="icon-btn icon-btn-del" data-med-del="${m.id}">🗑️</button>
          </div>
        </div>`}).join('')}
    </div>

    ${archived.length?`<div class="card">
      <div style="font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px">Archived</div>
      ${archived.map(m=>`<div class="med-item" style="opacity:.6">
        <div style="width:28px;height:28px;border-radius:50%;border:2px solid var(--border);flex-shrink:0"></div>
        <div style="flex:1"><div class="med-name">${m.name}</div><div class="med-dose">${m.dose||''}</div></div>
        <button class="icon-btn" style="background:var(--surface-alt);color:var(--pink)" data-med-restore="${m.id}">↺</button>
      </div>`).join('')}
    </div>`:''}

    <div class="card">
      <div style="font-size:13px;font-weight:700;color:var(--pink-dark);margin-bottom:12px">📋 Med Log History</div>
      ${Object.keys(logs).sort((a,b)=>b.localeCompare(a)).slice(0,7).map(date=>{
        const dayLog=logs[date],taken=Object.values(dayLog).filter(v=>v==='done').length,total=active.length
        return`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:13px">${date}</span>
          <span style="font-size:12px;color:${taken===total?'var(--green)':'var(--orange)'};font-weight:600">${taken}/${total} taken</span>
        </div>`}).join('')}
      ${Object.keys(logs).length===0?'<p style="font-size:13px;color:var(--muted)">No history yet. Start checking off meds!</p>':''}
    </div>
  `
  document.getElementById('add-med-btn').addEventListener('click',()=>showMedModal(null))
  document.querySelectorAll('[data-mc]').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.mc,logs=DB.medLogs,tlog=logs[today]||{}
    tlog[id]=tlog[id]==='done'?null:'done'
    logs[today]=tlog;DB.saveMedLogs(logs);renderMeds()
  }))
  document.querySelectorAll('[data-med-edit]').forEach(btn=>btn.addEventListener('click',()=>{
    const m=DB.meds.find(x=>x.id===btn.dataset.medEdit);if(m)showMedModal(m)
  }))
  document.querySelectorAll('[data-med-del]').forEach(btn=>btn.addEventListener('click',()=>{
    if(!confirm('Archive this medication?'))return
    DB.saveMeds(DB.meds.map(m=>m.id===btn.dataset.medDel?{...m,active:false}:m));renderMeds()
  }))
  document.querySelectorAll('[data-med-restore]').forEach(btn=>btn.addEventListener('click',()=>{
    DB.saveMeds(DB.meds.map(m=>m.id===btn.dataset.medRestore?{...m,active:true}:m));renderMeds()
  }))
}

function showMedModal(existing){
  const ov=document.createElement('div');ov.className='overlay'
  ov.innerHTML=`<div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">${existing?'Edit Medication':'Add Medication'}</div>
    <div class="form-group"><label>Medication name *</label><input type="text" id="med-name" class="form-input" value="${existing?.name||''}" placeholder="e.g. Metformin, Spironolactone"></div>
    <div class="form-group"><label>Dose</label><input type="text" id="med-dose" class="form-input" value="${existing?.dose||''}" placeholder="e.g. 500mg, 25mg"></div>
    <div class="form-group"><label>Frequency</label>
      <select id="med-freq" class="form-input">
        <option value="">Select...</option>
        ${['Once daily','Twice daily','Three times daily','Every other day','Weekly','As needed'].map(f=>`<option value="${f}" ${existing?.frequency===f?'selected':''}>${f}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label>Time</label>
      <select id="med-time" class="form-input">
        <option value="">Any time</option>
        ${['Morning','Afternoon','Evening','Bedtime','With food'].map(t=>`<option value="${t}" ${existing?.time===t?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label>Pills remaining (for refill alert)</label><input type="number" id="med-pills" class="form-input" value="${existing?.pillsLeft??''}" placeholder="e.g. 30" min="0"></div>
    <div class="form-group"><label>Notes</label><input type="text" id="med-notes" class="form-input" value="${existing?.notes||''}" placeholder="e.g. Take with food"></div>
    <div id="med-error" class="form-error" style="display:none"></div>
    <button class="btn btn-primary" id="save-med" style="margin-bottom:8px">Save</button>
    <button class="btn btn-secondary" id="cancel-med">Cancel</button>
  </div>`
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()})
  document.body.appendChild(ov)
  document.getElementById('cancel-med').addEventListener('click',()=>ov.remove())
  document.getElementById('save-med').addEventListener('click',()=>{
    const name=document.getElementById('med-name').value.trim()
    const err=document.getElementById('med-error')
    if(!name){err.style.display='block';err.textContent='Medication name is required';return}
    const pillsVal=document.getElementById('med-pills').value
    const med={
      id:existing?.id||crypto.randomUUID(),name,
      dose:document.getElementById('med-dose').value.trim(),
      frequency:document.getElementById('med-freq').value,
      time:document.getElementById('med-time').value,
      pillsLeft:pillsVal!==''?parseInt(pillsVal):null,
      notes:document.getElementById('med-notes').value.trim(),
      active:true,
      addedDate:existing?.addedDate||todayISO()
    }
    const meds=DB.meds
    if(existing){const i=meds.findIndex(m=>m.id===existing.id);if(i>=0)meds[i]=med}
    else meds.unshift(med)
    DB.saveMeds(meds);ov.remove();renderMeds()
  })
}

// ── Health (Blood Work) ───────────────────────────────────────────────────────
let healthTab='results'
function renderHealth(){
  const tests=DB.bloodTests.sort((a,b)=>b.date.localeCompare(a.date))
  const categories=[...new Set(BLOOD_MARKERS.map(m=>m.category))]
  content.innerHTML=`
    <h1 class="page-title">🩺 Health</h1>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      ${['results','trends','add'].map(t=>`<button class="chip${healthTab===t?' active':''}" data-htab="${t}">${t==='results'?'📋 Results':t==='trends'?'📈 Trends':'+ New Test'}</button>`).join('')}
    </div>

    ${healthTab==='add'?renderAddTest():''}
    ${healthTab==='results'?renderBloodResults(tests):''}
    ${healthTab==='trends'?renderTrends(tests):''}
  `
  document.querySelectorAll('[data-htab]').forEach(el=>el.addEventListener('click',()=>{healthTab=el.dataset.htab;renderHealth()}))

function renderBloodResults(tests){
  if(tests.length===0)return`<div class="empty-state"><div class="ei">🩺</div><p>No blood tests logged yet.<br>Tap "+ New Test" to add your results.</p></div>`
  return tests.map(test=>`
    <div class="card test-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div>
          <div style="font-size:14px;font-weight:700">${test.label||'Blood Test'}</div>
          <div style="font-size:12px;color:var(--muted)">${test.date}${test.lab?' · '+test.lab:''}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          ${test.photoUrl?`<img src="${test.photoUrl}" class="photo-thumb" data-photo="${test.photoUrl}">`:''}
          <button class="icon-btn icon-btn-del" data-test-del="${test.id}">🗑️</button>
        </div>
      </div>
      ${(test.results||[]).map(r=>{
        const marker=BLOOD_MARKERS.find(m=>m.id===r.markerId)
        if(!marker)return''
        const flag=flagValue(marker,r.value)
        const flagHtml=flag?`<span class="flag flag-${flag}">${flag==='ok'?'✓ Normal':flag==='low'?'↓ Low':'↑ High'}</span>`:''
        return`<div class="bw-marker-row">
          <div style="flex:1">
            <div class="bw-marker-name">${marker.label}</div>
            <div class="bw-marker-range">Optimal: ${marker.optimal} ${marker.unit}</div>
          </div>
          <div style="text-align:right">
            <div class="bw-marker-val" style="color:${flag==='ok'?'var(--green)':flag==='low'?'var(--blue)':'var(--orange)'}">${r.value} ${marker.unit}</div>
            ${flagHtml}
          </div>
        </div>`}).join('')}
      ${test.notes?`<div style="font-size:12px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">${test.notes}</div>`:''}
    </div>`).join('')
}

function renderTrends(tests){
  if(tests.length<2)return`<div class="card"><p style="font-size:13px;color:var(--muted);text-align:center">Log at least 2 tests to see trends.</p></div>`
  const allMarkerIds=[...new Set(tests.flatMap(t=>(t.results||[]).map(r=>r.markerId)))]
  return allMarkerIds.map(mid=>{
    const marker=BLOOD_MARKERS.find(m=>m.id===mid);if(!marker)return''
    const pts=tests.filter(t=>(t.results||[]).some(r=>r.markerId===mid)).map(t=>({date:t.date,val:parseFloat((t.results||[]).find(r=>r.markerId===mid)?.value||'0')})).filter(p=>!isNaN(p.val)).sort((a,b)=>a.date.localeCompare(b.date))
    if(pts.length<2)return''
    const min=Math.min(...pts.map(p=>p.val)),max=Math.max(...pts.map(p=>p.val)),range=max-min||1
    return`<div class="card">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px">${marker.label} <span style="font-size:11px;color:var(--muted);font-weight:400">${marker.unit}</span></div>
      <div style="display:flex;align-items:flex-end;gap:6px;height:60px;margin-bottom:6px">
        ${pts.map(p=>{
          const h=Math.round(((p.val-min)/range)*50)+10
          const flag=flagValue(marker,p.val)
          const col=flag==='ok'?'var(--green)':flag==='low'?'var(--blue)':'var(--orange)'
          return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
            <div style="font-size:9px;color:var(--muted)">${p.val}</div>
            <div style="width:100%;height:${h}px;background:${col};border-radius:3px 3px 0 0"></div>
          </div>`}).join('')}
      </div>
      <div style="display:flex;justify-content:space-between">
        ${pts.map(p=>`<div style="flex:1;text-align:center;font-size:9px;color:var(--muted)">${p.date.slice(5)}</div>`).join('')}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px">Optimal: ${marker.optimal} ${marker.unit}</div>
    </div>`}).join('')
}

let pendingPhotoUrl=null
function wireAddTest(){
  pendingPhotoUrl=null
  document.getElementById('photo-btn')?.addEventListener('click',()=>document.getElementById('test-photo')?.click())
  document.getElementById('test-photo')?.addEventListener('change',e=>{
    const file=e.target.files[0];if(!file)return
    const reader=new FileReader()
    reader.onload=ev=>{
      pendingPhotoUrl=ev.target.result
      document.getElementById('photo-preview').innerHTML=`<img src="${pendingPhotoUrl}" style="max-width:100%;border-radius:var(--r-md);border:2px solid var(--border)">`
    }
    reader.readAsDataURL(file)
  })
  document.getElementById('save-test')?.addEventListener('click',()=>{
    const results=[]
    document.querySelectorAll('.marker-input').forEach(inp=>{
      if(inp.value.trim())results.push({markerId:inp.dataset.marker,value:inp.value.trim()})
    })
    const test={
      id:crypto.randomUUID(),
      date:document.getElementById('test-date').value||todayISO(),
      label:document.getElementById('test-label').value.trim()||'Blood Test',
      lab:document.getElementById('test-lab').value.trim(),
      notes:document.getElementById('test-notes').value.trim(),
      photoUrl:pendingPhotoUrl,
      results
    }
    const tests=DB.bloodTests;tests.unshift(test);DB.saveBloodTests(tests)
    pendingPhotoUrl=null;healthTab='results';renderHealth()
  })
}

function wireResults(tests){
  document.querySelectorAll('[data-test-del]').forEach(btn=>btn.addEventListener('click',()=>{
    if(!confirm('Delete this test?'))return
    DB.saveBloodTests(DB.bloodTests.filter(t=>t.id!==btn.dataset.testDel));renderHealth()
  }))
  document.querySelectorAll('[data-photo]').forEach(img=>img.addEventListener('click',()=>{
    const ov=document.createElement('div');ov.className='overlay';ov.style.alignItems='center'
    ov.innerHTML=`<div style="max-width:400px;padding:16px"><img src="${img.dataset.photo}" style="width:100%;border-radius:var(--r-lg)"><button class="btn btn-secondary" id="close-photo" style="margin-top:12px">Close</button></div>`
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()})
    document.body.appendChild(ov)
    document.getElementById('close-photo').addEventListener('click',()=>ov.remove())
  }))
}

  document.getElementById('notif-toggle').addEventListener('click',async()=>{
    if(!DB.settings.notificationsEnabled){
      if(!('Notification'in window)){alert('Notifications not supported.');return}
      const p=await Notification.requestPermission()
      if(p==='granted'){DB.updateSetting('notificationsEnabled',true);renderSettings()}
      else alert('Please allow notifications in your browser settings.')
    }else{DB.updateSetting('notificationsEnabled',false);renderSettings()}
  })
  document.querySelectorAll('[data-delsym]').forEach(btn=>btn.addEventListener('click',()=>{
    DB.updateSetting('customSymptoms',(DB.settings.customSymptoms||[]).filter(s=>s!==btn.dataset.delsym));renderSettings()
  }))
  document.getElementById('add-sym').addEventListener('click',()=>{
    const val=document.getElementById('new-sym').value.trim();if(!val)return
    const cur=DB.settings.customSymptoms||[]
    if(cur.includes(val)){alert('Already exists!');return}
    DB.updateSetting('customSymptoms',[...cur,val]);renderSettings()
  })
  document.getElementById('new-sym').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('add-sym').click()})
  document.getElementById('export-btn').addEventListener('click',()=>{
    const data={cycles:DB.cycles,symptoms:DB.symptoms,meds:DB.meds,medLogs:DB.medLogs,bloodTests:DB.bloodTests,settings:DB.settings,exportedAt:new Date().toISOString()}
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'})
    const url=URL.createObjectURL(blob),a=document.createElement('a')
    a.href=url;a.download=`bloom-backup-${todayISO()}.json`;a.click();URL.revokeObjectURL(url)
  })
  document.getElementById('import-btn').addEventListener('click',()=>document.getElementById('import-file').click())
  document.getElementById('import-file').addEventListener('change',e=>{
    const file=e.target.files[0];if(!file)return
    const r=new FileReader()
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result)
        if(!confirm(`Import ${d.cycles?.length||0} cycles, ${d.symptoms?.length||0} symptoms, ${d.meds?.length||0} meds, ${d.bloodTests?.length||0} blood tests? Replaces current data.`))return
        if(d.cycles)DB.saveCycles(d.cycles)
        if(d.symptoms)DB.saveSymptoms(d.symptoms)
        if(d.meds)DB.saveMeds(d.meds)
        if(d.medLogs)DB.saveMedLogs(d.medLogs)
        if(d.bloodTests)DB.saveBloodTests(d.bloodTests)
        if(d.settings)DB.saveSettings({...DB.settings,...d.settings})
        alert('✅ Data imported!');renderSettings()
      }catch{alert('❌ Invalid backup file.')}
    }
    r.readAsText(file)
  })
  document.getElementById('clear-btn').addEventListener('click',()=>{
    if(!confirm('Delete ALL data permanently?'))return
    ['pt_cycles','pt_symptoms','pt_settings','pt_meds','pt_medlogs','pt_blood'].forEach(k=>localStorage.removeItem(k))
    location.reload()
  })
  document.getElementById('add-cycle-btn').addEventListener('click',()=>showCycleEditModal(null,renderSettings))
  document.querySelectorAll('[data-edit-cycle]').forEach(btn=>btn.addEventListener('click',()=>{
    const c=DB.cycles.find(x=>x.id===btn.dataset.editCycle);if(c)showCycleEditModal(c,renderSettings)
  }))
  document.querySelectorAll('[data-del-cycle]').forEach(btn=>btn.addEventListener('click',()=>{
    if(!confirm('Delete this cycle?'))return
    DB.saveCycles(DB.cycles.filter(c=>c.id!==btn.dataset.delCycle));renderSettings()
  }))
}

function showCycleEditModal(cycle,onSave){
  const today=todayISO(),ov=document.createElement('div');ov.className='overlay'
  const fmtDisplay=iso=>iso?parseISO(iso).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'—'
  ov.innerHTML=`<div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">${cycle?'Edit Cycle':'Log Past Period'}</div>
    <p style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:14px">Enter the exact start and end dates.</p>
    <div class="form-group"><label>Start date</label><input type="date" id="ce-start" class="form-input" value="${cycle?.startDate||''}" max="${today}"></div>
    <div id="ce-start-preview" style="font-size:12px;color:var(--pink-dark);text-align:center;margin:-6px 0 10px;font-weight:600">${cycle?.startDate?'Start: '+fmtDisplay(cycle.startDate):'No date selected'}</div>
    <div class="form-group"><label>End date <span class="optional">(optional)</span></label><input type="date" id="ce-end" class="form-input" value="${cycle?.endDate||''}" max="${today}"></div>
    <div id="ce-end-preview" style="font-size:12px;color:var(--muted);text-align:center;margin:-6px 0 10px">${cycle?.endDate?'End: '+fmtDisplay(cycle.endDate):''}</div>
    <div id="ce-error" class="form-error" style="display:none"></div>
    <button class="btn btn-primary" id="ce-save" style="margin-bottom:8px">Save</button>
    <button class="btn btn-secondary" id="ce-cancel">Cancel</button>
  </div>`
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()})
  document.body.appendChild(ov)
  document.getElementById('ce-cancel').addEventListener('click',()=>ov.remove())
  document.getElementById('ce-start').addEventListener('change',e=>{document.getElementById('ce-start-preview').textContent=e.target.value?'Start: '+fmtDisplay(e.target.value):'No date selected'})
  document.getElementById('ce-end').addEventListener('change',e=>{document.getElementById('ce-end-preview').textContent=e.target.value?'End: '+fmtDisplay(e.target.value):''})
  document.getElementById('ce-save').addEventListener('click',()=>{
    const start=document.getElementById('ce-start').value,end=document.getElementById('ce-end').value,err=document.getElementById('ce-error')
    if(!start){err.style.display='block';err.textContent='Start date is required';return}
    if(end&&end<start){err.style.display='block';err.textContent='End date must be after start date';return}
    if(start>today){err.style.display='block';err.textContent='Date cannot be in the future';return}
    if(cycle){
      DB.saveCycles(DB.cycles.map(x=>x.id===cycle.id?{...x,startDate:start,endDate:end||null}:x))
    }else{
      const c=[...DB.cycles]
      c.unshift({id:crypto.randomUUID(),startDate:start,endDate:end||null,notes:''})
      DB.saveCycles(c)
    }
    ov.remove();onSave()
  })
}

// ── Notifications ─────────────────────────────────────────────────────────────
async function checkReminders(){
  const s=DB.settings;if(!s.notificationsEnabled)return
  if(!('Notification'in window)||Notification.permission!=='granted')return
  const pred=predictNext(DB.cycles,s);if(!pred)return
  const rISO=toISO(addDays(parseISO(pred.predictedStart),-s.reminderDaysBefore))
  const key=`pt_notif_sent_${pred.predictedStart}`
  if(localStorage.getItem(key)||rISO!==todayISO())return
  const reg=await navigator.serviceWorker?.ready
  if(reg){await reg.showNotification('Bloom reminder 🌸',{body:`Your period is expected in ${s.reminderDaysBefore} day(s).`,icon:'icons/icon-192.png',tag:'period-reminder'});localStorage.setItem(key,'1')}
}

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})
render()
checkReminders()
</script>
