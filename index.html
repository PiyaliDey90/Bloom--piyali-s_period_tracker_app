<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bloom" />
  <meta name="theme-color" content="#c97baa" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>Bloom — Period Tracker</title>
  <style>
    :root {
      --pink:#c97baa; --pink-light:#f0c4df; --pink-dark:#9e5080;
      --purple:#9b7ec8; --purple-light:#d8cff0;
      --bg:#fdf0f6; --surface:#ffffff; --surface-alt:#f9e8f3; --border:#e8c8de;
      --text:#3d2040; --muted:#8a607a; --white:#ffffff;
      --period-color:#e8648c; --period-bg:#fde8ef;
      --fertile-color:#b090e0; --fertile-bg:#ede8f8;
      --predicted:#f4aec8; --ovulation:#7a4fbf;
      --green:#4caf7d; --blue:#5b8fd6;
      --shadow:0 2px 12px rgba(201,123,170,.12);
      --shadow-lg:0 8px 40px rgba(61,32,64,.2);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-top:env(safe-area-inset-top,0px);
      --nav-h:64px;
      --r-sm:6px; --r-md:12px; --r-lg:20px; --r-full:9999px;
      --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#1e0f1a; --surface:#2d1a28; --surface-alt:#3a2235; --border:#5a3050; --text:#f0d8ea; --muted:#c09ab0; }
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
    button{font-family:inherit;cursor:pointer;border:none;background:none}
    input,textarea,select{font-family:inherit;font-size:15px;color:var(--text)}

    #app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;position:relative;overflow:hidden}
    #content{flex:1;overflow-y:auto;padding:16px;padding-top:calc(var(--safe-top) + 16px);padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 24px)}

    /* Nav */
    .nav{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:calc(var(--nav-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--surface);border-top:1px solid var(--border);z-index:100}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);padding-top:8px;cursor:pointer;transition:color .15s}
    .nav-item.active{color:var(--pink)}
    .nav-icon{font-size:20px;line-height:1}
    .nav-label{font-size:10px;font-weight:500}

    /* Shared */
    .page-title{font-size:24px;font-weight:700;margin-bottom:20px}
    .card{background:var(--surface);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
    .btn{border-radius:var(--r-full);padding:12px 24px;font-size:15px;font-weight:600;width:100%;transition:opacity .15s}
    .btn:active{opacity:.8}
    .btn-primary{background:var(--pink);color:var(--white)}
    .btn-secondary{background:var(--surface-alt);color:var(--pink-dark)}
    .btn-danger{background:#fde8ef;color:#e8648c}
    .btn-saved{background:var(--green)!important;color:white!important}
    .section-label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
    .form-input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--surface-alt);color:var(--text);font-size:15px}
    .form-input:focus{outline:none;border-color:var(--pink)}
    .form-error{color:#e8648c;font-size:13px;margin-bottom:12px}
    .chip-row{display:flex;gap:8px;flex-wrap:wrap}
    .chip{border:1.5px solid var(--border);border-radius:var(--r-full);padding:8px 14px;font-size:13px;color:var(--muted);background:transparent;transition:all .15s;white-space:nowrap;cursor:pointer}
    .chip.active{background:var(--pink);border-color:var(--pink);color:white}

    /* Dashboard */
    .status-card{border-radius:var(--r-lg);padding:24px;margin-bottom:16px;text-align:center;transition:transform .1s}
    .status-card.clickable{cursor:pointer}
    .status-card.clickable:active{transform:scale(.98)}
    .status-period{background:linear-gradient(135deg,#e8648c,#c97baa);color:white}
    .status-today{background:linear-gradient(135deg,#c97baa,#9b7ec8);color:white}
    .status-late{background:linear-gradient(135deg,#9b7ec8,#7a6eb0);color:white}
    .status-upcoming{background:linear-gradient(135deg,var(--surface-alt),var(--pink-light))}
    .status-neutral{background:var(--surface-alt)}
    .status-label{font-size:22px;font-weight:700;margin-bottom:8px}
    .status-sub{font-size:13px;opacity:.85}
    .fertile-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .fertile-dot{width:10px;height:10px;border-radius:50%;background:var(--purple);flex-shrink:0}
    .fertile-title{font-size:13px;font-weight:600;color:var(--purple)}
    .fertile-dates{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .ov-badge{background:var(--purple-light);color:var(--ovulation);border-radius:var(--r-full);padding:2px 12px;font-size:11px;font-weight:600}
    .stats-row{display:flex;gap:10px;margin-bottom:16px}
    .stat-pill{flex:1;background:var(--surface);border-radius:var(--r-md);padding:12px;text-align:center;box-shadow:var(--shadow)}
    .stat-value{display:block;font-size:22px;font-weight:700;color:var(--pink)}
    .stat-label{display:block;font-size:10px;color:var(--muted);margin-top:2px}
    .install-banner{background:linear-gradient(135deg,var(--pink-light),var(--purple-light));border-radius:var(--r-md);padding:16px;margin-bottom:16px;font-size:13px;line-height:1.5}
    .install-banner strong{display:block;margin-bottom:4px}

    /* Modal */
    .overlay{position:fixed;inset:0;background:rgba(61,32,64,.4);display:flex;align-items:flex-end;z-index:200;animation:fadeIn .2s}
    .sheet{width:100%;max-width:430px;margin:0 auto;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:16px 20px calc(24px + var(--safe-bottom));box-shadow:var(--shadow-lg);animation:slideUp .25s ease;max-height:90vh;overflow-y:auto}
    .sheet-handle{width:40px;height:4px;background:var(--border);border-radius:var(--r-full);margin:0 auto 20px}
    .sheet-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:20px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
    .optional{font-weight:400}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

    /* Calendar */
    .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .cal-title{font-size:18px;font-weight:700}
    .cal-nav{font-size:26px;color:var(--pink);padding:4px 12px}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:16px}
    .cal-dayname{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0 8px}
    .cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;position:relative;font-size:13px;font-weight:500;transition:transform .1s}
    .cal-day:active{transform:scale(.9)}
    .cal-period{background:var(--period-bg);color:var(--period-color);font-weight:700}
    .cal-predicted{border:2px dashed var(--predicted)}
    .cal-fertile{background:var(--fertile-bg);color:var(--fertile-color)}
    .cal-ovulation{background:var(--purple-light);color:var(--ovulation);font-weight:700}
    .cal-today-ring{outline:2px solid var(--pink);outline-offset:1px}
    .cal-selected{outline:2.5px solid var(--pink-dark);outline-offset:1px}
    .cal-symdot{position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--pink-dark)}
    .cal-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
    .legend-dot{width:10px;height:10px;border-radius:3px}
    .day-detail{padding:16px}
    .day-detail-date{font-weight:700;margin-bottom:12px;color:var(--pink-dark)}
    .status-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .sbadge{font-size:11px;font-weight:600;border-radius:var(--r-full);padding:2px 12px}
    .sbadge-period{background:var(--period-bg);color:var(--period-color)}
    .sbadge-predicted{background:var(--pink-light);color:var(--pink-dark)}
    .sbadge-fertile{background:var(--fertile-bg);color:var(--fertile-color)}
    .sbadge-ovulation{background:var(--purple-light);color:var(--ovulation)}
    .detail-row{font-size:13px;color:var(--muted);margin-bottom:4px}
    .detail-row b{color:var(--text)}
    .detail-empty{font-size:13px;color:var(--muted)}

    /* History */
    .history-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
    .hstat{background:var(--surface);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow);text-align:center}
    .hstat-val{font-size:26px;font-weight:700;color:var(--pink)}
    .hstat-label{font-size:11px;color:var(--muted);margin-top:2px}
    .cycle-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
    .cycle-item:last-child{border-bottom:none}
    .cycle-dot{width:12px;height:12px;border-radius:50%;background:var(--period-color);flex-shrink:0}
    .cycle-info{flex:1;min-width:0}
    .cycle-dates{font-size:14px;font-weight:600}
    .cycle-meta{font-size:12px;color:var(--muted);margin-top:2px}
    .cycle-actions{display:flex;gap:8px}
    .icon-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
    .icon-btn-edit{background:var(--purple-light);color:var(--ovulation)}
    .icon-btn-del{background:#fde8ef;color:#e8648c}
    .empty-state{text-align:center;padding:48px 16px;color:var(--muted)}
    .empty-state .empty-icon{font-size:48px;margin-bottom:12px}
    .empty-state p{font-size:14px;line-height:1.6}

    /* Phase Card */
    .phase-card{border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px;cursor:pointer;transition:transform .1s;position:relative;overflow:hidden}
    .phase-card:active{transform:scale(.98)}
    .phase-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .phase-badge{display:flex;align-items:center;gap:8px}
    .phase-emoji{font-size:22px}
    .phase-name{font-size:16px;font-weight:700}
    .phase-day{font-size:12px;opacity:.75;font-weight:500}
    .phase-desc{font-size:13px;opacity:.85;line-height:1.5;margin-bottom:12px}
    .phase-quick-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
    .phase-chip{border-radius:var(--r-full);padding:4px 10px;font-size:11px;font-weight:600;opacity:.9}
    .phase-cta{font-size:12px;font-weight:600;opacity:.7;text-align:right}
    .phase-acne-alert{background:rgba(255,255,255,.25);border-radius:var(--r-md);padding:10px 12px;margin-top:10px;font-size:12px;line-height:1.5;font-weight:500}

    /* Phase Modal */
    .phase-modal-header{border-radius:var(--r-lg);padding:20px;margin-bottom:20px;text-align:center}
    .phase-modal-emoji{font-size:40px;margin-bottom:8px}
    .phase-modal-name{font-size:20px;font-weight:700;margin-bottom:4px}
    .phase-modal-days{font-size:13px;opacity:.8}
    .phase-modal-desc{font-size:14px;line-height:1.6;margin-bottom:4px;opacity:.9}
    .phase-section-title{font-size:14px;font-weight:700;color:var(--pink-dark);margin-bottom:12px;display:flex;align-items:center;gap:6px}
    .rec-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
    .rec-item:last-child{border-bottom:none}
    .rec-emoji{font-size:22px;flex-shrink:0;width:32px;text-align:center}
    .rec-label{font-size:14px;font-weight:600;margin-bottom:2px}
    .rec-reason{font-size:12px;color:var(--muted);line-height:1.4}
    .avoid-list{display:flex;flex-direction:column;gap:8px}
    .avoid-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--border)}
    .avoid-item:last-child{border-bottom:none}
    .avoid-x{color:#e8648c;font-weight:700;font-size:16px;width:20px;flex-shrink:0}
    .tip-box{background:var(--surface-alt);border-radius:var(--r-md);padding:14px;font-size:13px;line-height:1.6;color:var(--text);margin-top:4px}
    .acne-box{border-radius:var(--r-md);padding:14px;font-size:13px;line-height:1.6;margin-top:4px;border:2px solid rgba(232,100,140,.3)}

    /* Log extras */
    .water-row{display:flex;align-items:center;gap:16px}
    .water-count{font-size:28px;font-weight:700;color:var(--blue);min-width:32px;text-align:center}
    .water-btn{width:36px;height:36px;border-radius:50%;background:var(--purple-light);color:var(--purple);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center}
    .water-btn:active{background:var(--purple);color:white}
    .weight-row{display:flex;align-items:center;gap:12px}
    .weight-input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--surface-alt);color:var(--text);font-size:16px}
    .weight-unit{font-size:13px;color:var(--muted);font-weight:600}

    /* Settings */
    .settings-section{font-size:15px;font-weight:700;color:var(--pink-dark);margin-bottom:16px}
    .stepper-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
    .stepper-row:last-child{border-bottom:none}
    .stepper-label{font-size:13px}
    .stepper-controls{display:flex;align-items:center;gap:12px}
    .stepper-btn{width:32px;height:32px;border-radius:50%;background:var(--pink-light);color:var(--pink-dark);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
    .stepper-btn:active{background:var(--pink);color:white}
    .stepper-val{font-size:18px;font-weight:700;min-width:28px;text-align:center;color:var(--pink)}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .toggle-label{font-size:13px;font-weight:600}
    .toggle-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .toggle-btn{background:var(--border);color:var(--muted);border-radius:var(--r-full);padding:8px 16px;font-size:13px;font-weight:700}
    .toggle-btn.on{background:var(--pink);color:white}
    .notif-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}
    .data-info{font-size:13px;color:var(--muted);margin-bottom:16px}
    .about-block{text-align:center;padding:24px 16px;color:var(--muted);font-size:13px;line-height:2}
    .custom-sym-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
    .custom-sym-item{display:flex;align-items:center;justify-content:space-between;background:var(--surface-alt);border-radius:var(--r-md);padding:10px 14px}
    .custom-sym-name{font-size:14px}
    .add-sym-row{display:flex;gap:8px}
    .add-sym-input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--surface-alt);color:var(--text);font-size:14px}
    .add-sym-input:focus{outline:none;border-color:var(--pink)}
    .add-sym-btn{background:var(--pink);color:white;border-radius:var(--r-md);padding:10px 16px;font-size:14px;font-weight:600;white-space:nowrap}
  </style>
</head>
<body>
<div id="app">
  <div id="content"></div>
  <nav class="nav">
    <div class="nav-item active" data-page="home">
      <span class="nav-icon">🌸</span><span class="nav-label">Home</span>
    </div>
    <div class="nav-item" data-page="calendar">
      <span class="nav-icon">📅</span><span class="nav-label">Calendar</span>
    </div>
    <div class="nav-item" data-page="log">
      <span class="nav-icon">✏️</span><span class="nav-label">Log</span>
    </div>
    <div class="nav-item" data-page="history">
      <span class="nav-icon">📊</span><span class="nav-label">History</span>
    </div>
    <div class="nav-item" data-page="settings">
      <span class="nav-icon">⚙️</span><span class="nav-label">Settings</span>
    </div>
  </nav>
</div>

<script>
// ── Data Layer ───────────────────────────────────────────────────────────────
const DB = {
  get cycles()  { try{return JSON.parse(localStorage.getItem('pt_cycles')||'[]')}catch{return[]} },
  get symptoms(){ try{return JSON.parse(localStorage.getItem('pt_symptoms')||'[]')}catch{return[]} },
  get settings(){
    try{
      return {
        averageCycleLength:28, averagePeriodLength:5,
        notificationsEnabled:false, reminderDaysBefore:2,
        weightUnit:'kg', customSymptoms:[],
        ...JSON.parse(localStorage.getItem('pt_settings')||'{}')
      }
    }catch{return{averageCycleLength:28,averagePeriodLength:5,notificationsEnabled:false,reminderDaysBefore:2,weightUnit:'kg',customSymptoms:[]}}
  },
  saveCycles(v)   { localStorage.setItem('pt_cycles',   JSON.stringify(v)) },
  saveSymptoms(v) { localStorage.setItem('pt_symptoms', JSON.stringify(v)) },
  saveSettings(v) { localStorage.setItem('pt_settings', JSON.stringify(v)) },
  updateSetting(k,v){ const s=this.settings; s[k]=v; this.saveSettings(s) }
}

// ── Date Utilities ────────────────────────────────────────────────────────────
function todayISO(){ return toISO(new Date()) }
function toISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` }
function pad(n){ return String(n).padStart(2,'0') }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d) }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000) }
function daysUntil(iso){ return daysBetween(todayISO(),iso) }
function isInRange(d,s,e){ return d>=s && d<=e }
function fmtShort(iso){ return parseISO(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'}) }
function fmtMonthYear(y,m){ return new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'}) }
function getDaysInMonth(y,m){ const days=[],d=new Date(y,m,1); while(d.getMonth()===m){days.push(toISO(d));d.setDate(d.getDate()+1)} return days }
function firstDayOfMonth(y,m){ return new Date(y,m,1).getDay() }

// ── Algorithms ────────────────────────────────────────────────────────────────
function avgCycleLength(cycles,fallback=28){
  const sorted=[...cycles].filter(c=>c.startDate).sort((a,b)=>a.startDate.localeCompare(b.startDate))
  if(sorted.length<2) return fallback
  const recent=sorted.slice(-7), lens=[]
  for(let i=1;i<recent.length;i++){const d=daysBetween(recent[i-1].startDate,recent[i].startDate);if(d>=15&&d<=60)lens.push(d)}
  if(!lens.length) return fallback
  return Math.round(lens.reduce((a,b)=>a+b,0)/lens.length)
}

function predictNext(cycles,settings){
  const sorted=[...cycles].filter(c=>c.startDate).sort((a,b)=>a.startDate.localeCompare(b.startDate))
  const last=sorted[sorted.length-1]; if(!last) return null
  const avg=avgCycleLength(cycles,settings.averageCycleLength)
  const start=addDays(parseISO(last.startDate),avg)
  return { predictedStart:toISO(start), predictedEnd:toISO(addDays(new Date(start),settings.averagePeriodLength-1)), confidence:sorted.length>=3?'high':'low' }
}

function fertileWindow(cycles,settings){
  const sorted=[...cycles].filter(c=>c.startDate).sort((a,b)=>a.startDate.localeCompare(b.startDate))
  const last=sorted[sorted.length-1]; if(!last) return null
  const avg=avgCycleLength(cycles,settings.averageCycleLength)
  const ov=addDays(parseISO(last.startDate),avg-14)
  return { fertileStart:toISO(addDays(ov,-5)), fertileEnd:toISO(addDays(ov,1)), ovulationDate:toISO(ov) }
}

function getDayStatus(iso,cycles,pred,fert){
  const s=[]
  for(const c of cycles){if(isInRange(iso,c.startDate,c.endDate||c.startDate)){s.push('period');break}}
  if(!s.includes('period')&&pred&&isInRange(iso,pred.predictedStart,pred.predictedEnd)) s.push('predicted')
  if(fert){if(iso===fert.ovulationDate)s.push('ovulation');else if(isInRange(iso,fert.fertileStart,fert.fertileEnd))s.push('fertile')}
  return s
}

function cycleStats(cycles){
  const sorted=[...cycles].filter(c=>c.startDate).sort((a,b)=>a.startDate.localeCompare(b.startDate))
  const lengths=[], periodLengths=[]
  for(let i=1;i<sorted.length;i++){
    const d=daysBetween(sorted[i-1].startDate,sorted[i].startDate)
    if(d>=15&&d<=60) lengths.push(d)
  }
  for(const c of sorted){
    if(c.endDate) periodLengths.push(daysBetween(c.startDate,c.endDate)+1)
  }
  return {
    total: sorted.length,
    avg: lengths.length ? Math.round(lengths.reduce((a,b)=>a+b,0)/lengths.length) : null,
    shortest: lengths.length ? Math.min(...lengths) : null,
    longest:  lengths.length ? Math.max(...lengths) : null,
    avgPeriod: periodLengths.length ? Math.round(periodLengths.reduce((a,b)=>a+b,0)/periodLengths.length*10)/10 : null
  }
}

function getCurrentPhase(cycles, settings) {
  const sorted=[...cycles].filter(c=>c.startDate).sort((a,b)=>b.startDate.localeCompare(a.startDate))
  const last=sorted[0]; if(!last) return null
  const today=todayISO()
  if(today < last.startDate) return null
  const cycleDay=daysBetween(last.startDate,today)+1
  const avg=avgCycleLength(cycles,settings.averageCycleLength)
  const periodLen=settings.averagePeriodLength
  const ovDay=avg-14

  let phaseKey
  if(cycleDay<=periodLen)          phaseKey='menstrual'
  else if(cycleDay<=ovDay-2)       phaseKey='follicular'
  else if(cycleDay<=ovDay+2)       phaseKey='ovulatory'
  else                             phaseKey='luteal'

  return { ...PHASES[phaseKey], key:phaseKey, cycleDay, cycleLength:avg }
}

let calYear,calMonth,calSelected=null
function renderCalendar(){
  const now=new Date()
  if(!calYear)     calYear=now.getFullYear()
  if(calMonth==null) calMonth=now.getMonth()
  const cycles=DB.cycles, settings=DB.settings
  const pred=predictNext(cycles,settings), fert=fertileWindow(cycles,settings)
  const days=getDaysInMonth(calYear,calMonth), firstDay=firstDayOfMonth(calYear,calMonth)
  const today=todayISO(), symDates=new Set(DB.symptoms.map(s=>s.date))
  const dayNames=['Su','Mo','Tu','We','Th','Fr','Sa']
  let grid=dayNames.map(d=>`<div class="cal-dayname">${d}</div>`).join('')
  for(let i=0;i<firstDay;i++) grid+='<div></div>'
  days.forEach(iso=>{
    const st=getDayStatus(iso,cycles,pred,fert)
    let cls='cal-day'
    if(st.includes('period'))    cls+=' cal-period'
    if(st.includes('predicted')) cls+=' cal-predicted'
    if(st.includes('fertile'))   cls+=' cal-fertile'
    if(st.includes('ovulation')) cls+=' cal-ovulation'
    if(iso===today)              cls+=' cal-today-ring'
    if(iso===calSelected)        cls+=' cal-selected'
    const dot=symDates.has(iso)?'<span class="cal-symdot"></span>':''
    grid+=`<div class="${cls}" data-iso="${iso}">${parseInt(iso.slice(8))}${dot}</div>`
  })
  const selSym=calSelected?DB.symptoms.find(s=>s.date===calSelected):null
  const selSt=calSelected?getDayStatus(calSelected,cycles,pred,fert):[]
  const bMap={period:'Period',predicted:'Predicted',fertile:'Fertile',ovulation:'Ovulation'}
  const bCls={period:'sbadge-period',predicted:'sbadge-predicted',fertile:'sbadge-fertile',ovulation:'sbadge-ovulation'}
  content.innerHTML=`
    <div class="cal-header">
      <button class="cal-nav" id="prev-month">‹</button>
      <span class="cal-title">${fmtMonthYear(calYear,calMonth)}</span>
      <button class="cal-nav" id="next-month">›</button>
    </div>
    <div class="cal-grid">${grid}</div>
    <div class="cal-legend">
      <span class="legend-item"><span class="legend-dot" style="background:var(--period-bg);border:1px solid var(--period-color)"></span>Period</span>
      <span class="legend-item"><span class="legend-dot" style="border:2px dashed var(--predicted);background:transparent"></span>Predicted</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--fertile-bg)"></span>Fertile</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--purple-light)"></span>Ovulation</span>
    </div>
    ${calSelected?`<div class="card day-detail">
      <div class="day-detail-date">${calSelected}</div>
      ${selSt.length?`<div class="status-badges">${selSt.map(s=>`<span class="sbadge ${bCls[s]}">${bMap[s]}</span>`).join('')}</div>`:''}
      ${selSym?`
        ${selSym.flow?`<div class="detail-row"><b>Flow:</b> ${selSym.flow}</div>`:''}
        ${selSym.mood?`<div class="detail-row"><b>Mood:</b> ${selSym.mood}</div>`:''}
        ${selSym.symptoms?.length?`<div class="detail-row"><b>Symptoms:</b> ${selSym.symptoms.join(', ')}</div>`:''}
        ${selSym.weight?`<div class="detail-row"><b>Weight:</b> ${selSym.weight} ${DB.settings.weightUnit}</div>`:''}
        ${selSym.water?`<div class="detail-row"><b>Water:</b> ${selSym.water} glasses</div>`:''}
        ${selSym.notes?`<div class="detail-row"><b>Notes:</b> ${selSym.notes}</div>`:''}
      `:'<p class="detail-empty">No data logged for this day.</p>'}
    </div>`:''}
  `
  document.getElementById('prev-month').addEventListener('click',()=>{ if(calMonth===0){calMonth=11;calYear--}else calMonth--; renderCalendar() })
  document.getElementById('next-month').addEventListener('click',()=>{ if(calMonth===11){calMonth=0;calYear++}else calMonth++; renderCalendar() })
  document.querySelectorAll('.cal-day[data-iso]').forEach(el=>el.addEventListener('click',()=>{ calSelected=el.dataset.iso===calSelected?null:el.dataset.iso; renderCalendar() }))
}

      date:logState.date, flow:existing.flow||'', mood:existing.mood||'',
      symptoms:existing.symptoms||[], notes:existing.notes||'',
      weight:existing.weight||'', water:existing.water||0
    }
  }
  const settings=DB.settings
  const allSymptoms=[...SYMPTOMS,...(settings.customSymptoms||[]).map(s=>({id:`custom_${s}`,label:s,emoji:'🏷️'}))]

  content.innerHTML=`
    <h1 class="page-title">Log Today</h1>
    <div class="card">
      <span class="section-label">Date</span>
      <input type="date" id="log-date" class="form-input" value="${logState.date}" max="${todayISO()}">
    </div>
    <div class="card">
      <span class="section-label">Flow</span>
      <div class="chip-row">${FLOWS.map(f=>`<button class="chip${logState.flow===f.id?' active':''}" data-flow="${f.id}">${f.label}</button>`).join('')}</div>
    </div>
    <div class="card">
      <span class="section-label">Mood</span>
      <div class="chip-row">${MOODS.map(m=>`<button class="chip${logState.mood===m.id?' active':''}" data-mood="${m.id}">${m.emoji} ${m.label}</button>`).join('')}</div>
    </div>
    <div class="card">
      <span class="section-label">Symptoms</span>
      <div class="chip-row">${allSymptoms.map(s=>`<button class="chip${logState.symptoms.includes(s.id)?' active':''}" data-sym="${s.id}">${s.emoji} ${s.label}</button>`).join('')}</div>
    </div>
    <div class="card">
      <span class="section-label">💧 Water intake (glasses)</span>
      <div class="water-row">
        <button class="water-btn" id="water-dec">−</button>
        <span class="water-count" id="water-val">${logState.water}</span>
        <button class="water-btn" id="water-inc">+</button>
        <span style="font-size:13px;color:var(--muted);margin-left:4px">glasses today</span>
      </div>
    </div>
    <div class="card">
      <span class="section-label">⚖️ Weight (${settings.weightUnit})</span>
      <div class="weight-row">
        <input type="number" id="log-weight" class="weight-input" value="${logState.weight}" placeholder="e.g. 58.5" step="0.1" min="20" max="300">
        <span class="weight-unit">${settings.weightUnit}</span>
      </div>
    </div>
    <div class="card">
      <span class="section-label">Notes</span>
      <textarea id="log-notes" class="form-input" rows="3" placeholder="How are you feeling today?" style="resize:none">${logState.notes}</textarea>
    </div>
    <button class="btn btn-primary" id="save-log" style="margin-bottom:16px">Save</button>
  `

  document.getElementById('log-date').addEventListener('change',e=>{ logState.date=e.target.value; renderLog() })
  document.querySelectorAll('[data-flow]').forEach(el=>el.addEventListener('click',()=>{ logState.flow=logState.flow===el.dataset.flow?'':el.dataset.flow; renderLog() }))
  document.querySelectorAll('[data-mood]').forEach(el=>el.addEventListener('click',()=>{ logState.mood=logState.mood===el.dataset.mood?'':el.dataset.mood; renderLog() }))
  document.querySelectorAll('[data-sym]').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.sym
    logState.symptoms=logState.symptoms.includes(id)?logState.symptoms.filter(s=>s!==id):[...logState.symptoms,id]
    renderLog()
  }))
  document.getElementById('water-dec').addEventListener('click',()=>{ logState.water=Math.max(0,logState.water-1); document.getElementById('water-val').textContent=logState.water })
  document.getElementById('water-inc').addEventListener('click',()=>{ logState.water=Math.min(20,logState.water+1); document.getElementById('water-val').textContent=logState.water })
  document.getElementById('log-weight').addEventListener('input',e=>{ logState.weight=e.target.value })
  document.getElementById('log-notes').addEventListener('input',e=>{ logState.notes=e.target.value })
  document.getElementById('save-log').addEventListener('click',()=>{
    const syms=DB.symptoms, i=syms.findIndex(s=>s.date===logState.date)
    const entry={id:i>=0?syms[i].id:crypto.randomUUID(),...logState}
    if(i>=0) syms[i]={...syms[i],...entry}; else syms.unshift(entry)
    DB.saveSymptoms(syms)
    const btn=document.getElementById('save-log')
    btn.textContent='✓ Saved!'; btn.classList.add('btn-saved')
    setTimeout(()=>{ btn.textContent='Save'; btn.classList.remove('btn-saved') },2000)
  })
}

// ── History ───────────────────────────────────────────────────────────────────
function renderHistory(){
  const cycles=DB.cycles
  const sorted=[...cycles].filter(c=>c.startDate).sort((a,b)=>b.startDate.localeCompare(a.startDate))
  const stats=cycleStats(cycles)

  const statCards=[
    {val:stats.total||0,       label:'Total cycles'},
    {val:stats.avg?`${stats.avg}d`:'—',     label:'Avg cycle'},
    {val:stats.shortest?`${stats.shortest}d`:'—', label:'Shortest'},
    {val:stats.longest?`${stats.longest}d`:'—',   label:'Longest'},
  ]

  content.innerHTML=`
    <h1 class="page-title">History 📊</h1>
    <div class="history-stats">
      ${statCards.map(s=>`<div class="hstat"><div class="hstat-val">${s.val}</div><div class="hstat-label">${s.label}</div></div>`).join('')}
    </div>
    ${stats.avgPeriod?`<div class="card" style="padding:14px 20px;text-align:center">
      <span style="font-size:13px;color:var(--muted)">Average period duration: </span>
      <strong style="color:var(--period-color)">${stats.avgPeriod} days</strong>
    </div>`:''}
    <div class="card">
      <div class="settings-section">All Cycles</div>
      ${sorted.length===0?`<div class="empty-state"><div class="empty-icon">🌸</div><p>No cycles logged yet.<br>Tap Home → Log period to get started.</p></div>`
      :sorted.map((c,idx)=>{
        const nextCycle=sorted[idx-1]
        const cycleLen=nextCycle?daysBetween(c.startDate,nextCycle.startDate):null
        const periodLen=c.endDate?daysBetween(c.startDate,c.endDate)+1:null
        return `<div class="cycle-item">
          <span class="cycle-dot"></span>
          <div class="cycle-info">
            <div class="cycle-dates">${fmtShort(c.startDate)}${c.endDate?' – '+fmtShort(c.endDate):' (ongoing)'}</div>
            <div class="cycle-meta">${periodLen?`${periodLen} day period`:'No end date'}${cycleLen?` · ${cycleLen} day cycle`:''}</div>
          </div>
          <div class="cycle-actions">
            <button class="icon-btn icon-btn-edit" data-edit="${c.id}">✏️</button>
            <button class="icon-btn icon-btn-del" data-del="${c.id}">🗑️</button>
          </div>
        </div>`
      }).join('')}
    </div>
  `

  document.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click',()=>{
    if(!confirm('Delete this cycle?')) return
    DB.saveCycles(DB.cycles.filter(c=>c.id!==btn.dataset.del))
    renderHistory()
  }))

  document.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click',()=>{
    const c=DB.cycles.find(x=>x.id===btn.dataset.edit); if(!c) return
    const today=todayISO()
    const overlay=document.createElement('div')
    overlay.className='overlay'
    overlay.innerHTML=`
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">Edit Cycle</div>
        <div class="form-group"><label>Start date</label><input type="date" id="edit-start" class="form-input" value="${c.startDate}" max="${today}"></div>
        <div class="form-group"><label>End date <span class="optional">(optional)</span></label><input type="date" id="edit-end" class="form-input" value="${c.endDate||''}" max="${today}"></div>
        <div id="edit-error" class="form-error" style="display:none"></div>
        <button class="btn btn-primary" id="edit-save" style="margin-bottom:8px">Save changes</button>
        <button class="btn btn-secondary" id="edit-cancel">Cancel</button>
      </div>
    `
    overlay.addEventListener('click',e=>{ if(e.target===overlay)overlay.remove() })
    document.body.appendChild(overlay)
    document.getElementById('edit-cancel').addEventListener('click',()=>overlay.remove())
    document.getElementById('edit-save').addEventListener('click',()=>{
      const start=document.getElementById('edit-start').value
      const end=document.getElementById('edit-end').value
      const err=document.getElementById('edit-error')
      if(!start){err.style.display='block';err.textContent='Start date required';return}
      if(end&&end<start){err.style.display='block';err.textContent='End must be after start';return}
      const updated=DB.cycles.map(x=>x.id===c.id?{...x,startDate:start,endDate:end||null}:x)
      DB.saveCycles(updated); overlay.remove(); renderHistory()
    })
  }))
}

// ── Settings ──────────────────────────────────────────────────────────────────
function renderSettings(){
  const s=DB.settings, cycles=DB.cycles, syms=DB.symptoms

  content.innerHTML=`
    <h1 class="page-title">Settings</h1>
    <div class="card">
      <div class="settings-section">Cycle Settings</div>
      <div class="stepper-row">
        <span class="stepper-label">Average cycle length</span>
        <div class="stepper-controls">
          <button class="stepper-btn" id="cl-dec">−</button>
          <span class="stepper-val" id="cl-val">${s.averageCycleLength}</span>
          <button class="stepper-btn" id="cl-inc">+</button>
        </div>
      </div>
      <div class="stepper-row">
        <span class="stepper-label">Average period length</span>
        <div class="stepper-controls">
          <button class="stepper-btn" id="pl-dec">−</button>
          <span class="stepper-val" id="pl-val">${s.averagePeriodLength}</span>
          <button class="stepper-btn" id="pl-inc">+</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="settings-section">Units</div>
      <div class="toggle-row" style="margin-bottom:0">
        <div><div class="toggle-label">Weight unit</div></div>
        <button id="unit-toggle" class="toggle-btn on">${s.weightUnit.toUpperCase()}</button>
      </div>
    </div>

    <div class="card">
      <div class="settings-section">Custom Symptoms</div>
      <div class="custom-sym-list" id="custom-sym-list">
        ${(s.customSymptoms||[]).length===0?'<p style="font-size:13px;color:var(--muted)">No custom symptoms yet.</p>':
          (s.customSymptoms||[]).map(sym=>`
            <div class="custom-sym-item">
              <span class="custom-sym-name">🏷️ ${sym}</span>
              <button class="icon-btn icon-btn-del" data-delsym="${sym}">✕</button>
            </div>
          `).join('')}
      </div>
      <div class="add-sym-row">
        <input type="text" id="new-sym-input" class="add-sym-input" placeholder="e.g. Hot flashes" maxlength="30">
        <button class="add-sym-btn" id="add-sym-btn">Add</button>
      </div>
    </div>

    <div class="card">
      <div class="settings-section">Notifications</div>
      <div class="toggle-row">
        <div><div class="toggle-label">Period reminders</div><div class="toggle-sub">Notify before predicted period</div></div>
        <button id="notif-toggle" class="toggle-btn${s.notificationsEnabled?' on':''}">${s.notificationsEnabled?'ON':'OFF'}</button>
      </div>
      ${s.notificationsEnabled?`<div class="stepper-row">
        <span class="stepper-label">Days before to remind</span>
        <div class="stepper-controls">
          <button class="stepper-btn" id="rb-dec">−</button>
          <span class="stepper-val" id="rb-val">${s.reminderDaysBefore}</span>
          <button class="stepper-btn" id="rb-inc">+</button>
        </div>
      </div>`:''}
      ${!window.navigator.standalone?`<p class="notif-note">On iPhone, notifications require adding Bloom to your Home Screen first.</p>`:''}
    </div>

    <div class="card">
      <div class="settings-section">Data</div>
      <p class="data-info">${cycles.length} cycles · ${syms.length} symptom entries</p>
      <button class="btn btn-secondary" id="export-btn" style="margin-bottom:8px">Export backup (JSON)</button>
      <button class="btn btn-secondary" id="import-btn" style="margin-bottom:8px">Import backup (JSON)</button>
      <input type="file" id="import-file" accept=".json" style="display:none">
      <button class="btn btn-danger" id="clear-btn">Clear all data</button>
    </div>

    <div class="about-block"><p>🌸 Bloom Period Tracker v2</p><p>Your data stays on your device — never uploaded anywhere.</p></div>
  `

  document.getElementById('cl-dec').addEventListener('click',()=>{ const v=Math.max(21,DB.settings.averageCycleLength-1); DB.updateSetting('averageCycleLength',v); document.getElementById('cl-val').textContent=v })
  document.getElementById('cl-inc').addEventListener('click',()=>{ const v=Math.min(40,DB.settings.averageCycleLength+1); DB.updateSetting('averageCycleLength',v); document.getElementById('cl-val').textContent=v })
  document.getElementById('pl-dec').addEventListener('click',()=>{ const v=Math.max(2,DB.settings.averagePeriodLength-1); DB.updateSetting('averagePeriodLength',v); document.getElementById('pl-val').textContent=v })
  document.getElementById('pl-inc').addEventListener('click',()=>{ const v=Math.min(10,DB.settings.averagePeriodLength+1); DB.updateSetting('averagePeriodLength',v); document.getElementById('pl-val').textContent=v })
  document.getElementById('rb-dec')?.addEventListener('click',()=>{ const v=Math.max(1,DB.settings.reminderDaysBefore-1); DB.updateSetting('reminderDaysBefore',v); document.getElementById('rb-val').textContent=v })
  document.getElementById('rb-inc')?.addEventListener('click',()=>{ const v=Math.min(7,DB.settings.reminderDaysBefore+1); DB.updateSetting('reminderDaysBefore',v); document.getElementById('rb-val').textContent=v })

  document.getElementById('unit-toggle').addEventListener('click',()=>{
    const newUnit=DB.settings.weightUnit==='kg'?'lbs':'kg'
    DB.updateSetting('weightUnit',newUnit)
    document.getElementById('unit-toggle').textContent=newUnit.toUpperCase()
  })

  document.getElementById('notif-toggle').addEventListener('click',async()=>{
    if(!DB.settings.notificationsEnabled){
      if(!('Notification' in window)){alert('Notifications not supported.');return}
      const perm=await Notification.requestPermission()
      if(perm==='granted'){DB.updateSetting('notificationsEnabled',true);renderSettings()}
      else alert('Please allow notifications in your browser settings.')
    } else { DB.updateSetting('notificationsEnabled',false); renderSettings() }
  })

  // Custom symptoms
  document.querySelectorAll('[data-delsym]').forEach(btn=>btn.addEventListener('click',()=>{
    const updated=(DB.settings.customSymptoms||[]).filter(s=>s!==btn.dataset.delsym)
    DB.updateSetting('customSymptoms',updated); renderSettings()
  }))
  document.getElementById('add-sym-btn').addEventListener('click',()=>{
    const val=document.getElementById('new-sym-input').value.trim()
    if(!val) return
    const current=DB.settings.customSymptoms||[]
    if(current.includes(val)){alert('Already exists!');return}
    DB.updateSetting('customSymptoms',[...current,val])
    renderSettings()
  })
  document.getElementById('new-sym-input').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('add-sym-btn').click() })

  // Export
  document.getElementById('export-btn').addEventListener('click',()=>{
    const data={cycles:DB.cycles,symptoms:DB.symptoms,settings:DB.settings,exportedAt:new Date().toISOString()}
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'})
    const url=URL.createObjectURL(blob), a=document.createElement('a')
    a.href=url; a.download=`bloom-backup-${todayISO()}.json`; a.click(); URL.revokeObjectURL(url)
  })

  // Import
  document.getElementById('import-btn').addEventListener('click',()=>document.getElementById('import-file').click())
  document.getElementById('import-file').addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file) return
    const reader=new FileReader()
    reader.onload=ev=>{
      try {
        const data=JSON.parse(ev.target.result)
        if(!confirm(`Import ${data.cycles?.length||0} cycles and ${data.symptoms?.length||0} symptom entries? This will replace your current data.`)) return
        if(data.cycles)   DB.saveCycles(data.cycles)
        if(data.symptoms) DB.saveSymptoms(data.symptoms)
        if(data.settings) DB.saveSettings({...DB.settings,...data.settings})
        alert('✅ Data imported successfully!'); renderSettings()
      } catch { alert('❌ Invalid backup file. Please select a valid Bloom JSON backup.') }
    }
    reader.readAsText(file)
  })

  // Clear
  document.getElementById('clear-btn').addEventListener('click',()=>{
    if(!confirm('Delete all data permanently?')) return
    ['pt_cycles','pt_symptoms','pt_settings'].forEach(k=>localStorage.removeItem(k))
    location.reload()
  })
}

// ── Notifications ─────────────────────────────────────────────────────────────
async function checkReminders(){
  const s=DB.settings; if(!s.notificationsEnabled) return
  if(!('Notification' in window)||Notification.permission!=='granted') return
  const pred=predictNext(DB.cycles,s); if(!pred) return
  const reminderISO=toISO(addDays(parseISO(pred.predictedStart),-s.reminderDaysBefore))
  const key=`pt_notif_sent_${pred.predictedStart}`
  if(localStorage.getItem(key)||reminderISO!==todayISO()) return
  const reg=await navigator.serviceWorker?.ready
  if(reg){ await reg.showNotification('Bloom reminder 🌸',{body:`Your period is expected in ${s.reminderDaysBefore} day(s).`,icon:'icons/icon-192.png',tag:'period-reminder'}); localStorage.setItem(key,'1') }
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{})

render()
checkReminders()
</script>
</body>
</html>
